<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界時間儀表板</title>
  <style>
    :root {
      --bg-page: #0b1120;
      --bg-glow-1: rgba(56, 189, 248, 0.10);
      --bg-glow-2: rgba(129, 140, 248, 0.08);
      --bg-card: linear-gradient(160deg, rgba(30, 41, 59, 0.92) 0%, rgba(15, 23, 42, 0.96) 100%);
      --bg-card-home: linear-gradient(160deg, rgba(24, 48, 78, 0.95) 0%, rgba(15, 28, 52, 0.98) 100%);
      --border-card: rgba(148, 163, 184, 0.14);
      --border-card-hover: rgba(148, 163, 184, 0.30);
      --border-home: rgba(56, 189, 248, 0.42);
      --highlight-top: rgba(255, 255, 255, 0.07);
      --divider: rgba(148, 163, 184, 0.12);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --btn-bg: rgba(30, 41, 59, 0.85);
      --btn-hover: rgba(51, 65, 85, 0.95);
      --shadow-card: 0 10px 28px -6px rgba(2, 6, 23, 0.55), inset 0 1px 0 var(--highlight-top);
      --shadow-card-hover: 0 14px 32px -6px rgba(2, 6, 23, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    body.light {
      --bg-page: #eef2f6;
      --bg-glow-1: rgba(14, 165, 233, 0.09);
      --bg-glow-2: rgba(99, 102, 241, 0.06);
      --bg-card: linear-gradient(160deg, #ffffff 0%, #f8fafc 100%);
      --bg-card-home: linear-gradient(160deg, #f0f9ff 0%, #e0f2fe 100%);
      --border-card: rgba(15, 23, 42, 0.08);
      --border-card-hover: rgba(15, 23, 42, 0.18);
      --border-home: rgba(2, 132, 199, 0.38);
      --highlight-top: rgba(255, 255, 255, 0.9);
      --divider: rgba(15, 23, 42, 0.07);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent: #0284c7;
      --accent-soft: rgba(2, 132, 199, 0.10);
      --btn-bg: rgba(255, 255, 255, 0.9);
      --btn-hover: #f1f5f9;
      --shadow-card: 0 8px 24px -6px rgba(15, 23, 42, 0.08), inset 0 1px 0 var(--highlight-top);
      --shadow-card-hover: 0 12px 28px -6px rgba(15, 23, 42, 0.13), inset 0 1px 0 #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-page);
      background-image:
        radial-gradient(circle at 15% 15%, var(--bg-glow-1), transparent 42%),
        radial-gradient(circle at 85% 85%, var(--bg-glow-2), transparent 45%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* 置中懸浮畫布，保留四周呼吸感外框 */
    .app {
      height: 100dvh;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: clamp(16px, 2.8vh, 32px) clamp(20px, 3vw, 36px);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.8vh, 18px);
    }

    /* 精簡工具列 */
    .topbar {
      flex-shrink: 0;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.65); }
      70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .title-group h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      padding-left: 4px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      height: 32px;
      padding: 0 12px;
      border-radius: 9px;
      border: 1px solid var(--border-card);
      background: var(--btn-bg);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background: var(--btn-hover);
      border-color: var(--border-card-hover);
    }

    button:active {
      transform: scale(0.97);
    }

    /* 3x3 單屏九宮格 */
    .clock-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: clamp(12px, 1.8vh, 18px);
    }

    .card {
      min-height: 0;
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: clamp(12px, 1.8vh, 18px) clamp(16px, 1.8vw, 22px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--border-card-hover);
      box-shadow: var(--shadow-card-hover);
    }

    .card.is-home {
      background: var(--bg-card-home);
      border-color: var(--border-home);
    }

    /* 上排：國旗 + 城市名 (20px) + 日夜徽章 + UTC (16px) */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .city-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .flag-svg {
      width: 30px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(128, 128, 128, 0.28);
      display: block;
    }

    .city-name {
      font-size: clamp(18.5px, 2.5vh, 20px);
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .dn-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .dn-icon.day {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.18);
    }

    .dn-icon.night {
      background: rgba(129, 140, 248, 0.16);
      color: #818cf8;
      box-shadow: 0 0 10px rgba(129, 140, 248, 0.16);
    }

    .utc-text {
      font-size: clamp(14.5px, 2vh, 16px);
      font-weight: 600;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* 中排：即時大字體時鐘 */
    .time-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: auto 0;
    }

    .time-main {
      font-size: clamp(2rem, 4.7vh, 2.85rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .time-sec {
      font-size: clamp(1.1rem, 2.4vh, 1.45rem);
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .time-ampm {
      font-size: clamp(0.85rem, 1.7vh, 1rem);
      font-weight: 700;
      color: var(--text-secondary);
      margin-left: 2px;
    }

    /* 下排：日期星期 (16px) + 台北時差 (16px) */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: clamp(6px, 1vh, 10px);
      border-top: 1px solid var(--divider);
      font-size: clamp(14.5px, 2vh, 16px);
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .date-text {
      white-space: nowrap;
    }

    .diff-tag {
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .card.is-home .diff-tag {
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 9px;
      border-radius: 6px;
      font-size: clamp(14px, 1.9vh, 15px);
    }

    /* 窄螢幕 / 手機直向自動轉為單欄可捲動 */
    @media (max-width: 820px) {
      html, body {
        height: auto;
        overflow-y: auto;
      }
      .app {
        height: auto;
        padding: 16px;
      }
      .subtitle {
        display: none;
      }
      .clock-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }
      .card {
        padding: 16px 18px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-group">
        <span class="live-dot" title="即時同步中"></span>
        <h1>世界時間</h1>
        <span class="subtitle">自動即時跳秒 · 基準：台北 (UTC+8)</span>
      </div>
      <div class="controls">
        <button id="toggleFormat" type="button">24 小時制</button>
        <button id="toggleTheme" type="button">淺色模式</button>
        <button id="copyAll" type="button">複製時間</button>
      </div>
    </header>

    <main class="clock-grid" id="clockGrid"></main>
  </div>

  <script>
    const SUN_ICON = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
    const MOON_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

    const FLAGS = {
      TW: `<svg class="flag-svg" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
        <rect width="60" height="40" fill="#FE0000"/>
        <rect width="30" height="20" fill="#000095"/>
        <polygon points="15,2.5 15.98,6.33 18.75,3.5 17.69,7.31 21.5,6.25 18.67,9.02 22.5,10 18.67,10.98 21.5,13.75 17.69,12.69 18.75,16.5 15.98,13.67 15,17.5 14.02,13.67 11.25,16.5 12.31,12.69 8.5,13.75 11.33,10.98 7.5,10 11.33,9.02 8.5,6.25 12.31,7.31 11.25,3.5 14.02,6.33" fill="#FFFFFF"/>
        <circle cx="15" cy="10" r="4.2" fill="#000095"/>
        <circle cx="15" cy="10" r="3.4" fill="#FFFFFF"/>
      </svg>`,
      JP: `<svg class="flag-svg" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
        <rect width="60" height="40" fill="#FFFFFF"/>
        <circle cx="30" cy="20" r="12" fill="#BC002D"/>
      </svg>`,
      AU: `<svg class="flag-svg" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
        <rect width="60" height="40" fill="#00008B"/>
        <path d="M0,0 L30,20 M30,0 L0,20" stroke="#FFFFFF" stroke-width="3.6"/>
        <path d="M0,0 L30,20 M30,0 L0,20" stroke="#FF0000" stroke-width="1.8"/>
        <path d="M15,0 V20 M0,10 H30" stroke="#FFFFFF" stroke-width="6"/>
        <path d="M15,0 V20 M0,10 H30" stroke="#FF0000" stroke-width="3.5"/>
        <circle cx="15" cy="30" r="3.2" fill="#FFFFFF"/>
        <circle cx="45" cy="8" r="1.8" fill="#FFFFFF"/>
        <circle cx="39" cy="17" r="1.8" fill="#FFFFFF"/>
        <circle cx="51" cy="15" r="1.8" fill="#FFFFFF"/>
        <circle cx="45" cy="32" r="1.8" fill="#FFFFFF"/>
        <circle cx="48" cy="22" r="1.2" fill="#FFFFFF"/>
      </svg>`,
      US: `<svg class="flag-svg" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
        <rect width="60" height="40" fill="#FFFFFF"/>
        <g fill="#B22234">
          <rect y="0" width="60" height="3.08"/>
          <rect y="6.15" width="60" height="3.08"/>
          <rect y="12.3" width="60" height="3.08"/>
          <rect y="18.46" width="60" height="3.08"/>
          <rect y="24.61" width="60" height="3.08"/>
          <rect y="30.77" width="60" height="3.08"/>
          <rect y="36.92" width="60" height="3.08"/>
        </g>
        <rect width="26" height="21.54" fill="#3C3B6E"/>
        <g fill="#FFFFFF">
          <circle cx="4.5" cy="3.8" r="1"/><circle cx="9.8" cy="3.8" r="1"/><circle cx="15.1" cy="3.8" r="1"/><circle cx="20.4" cy="3.8" r="1"/>
          <circle cx="7.1" cy="7.3" r="1"/><circle cx="12.4" cy="7.3" r="1"/><circle cx="17.7" cy="7.3" r="1"/>
          <circle cx="4.5" cy="10.8" r="1"/><circle cx="9.8" cy="10.8" r="1"/><circle cx="15.1" cy="10.8" r="1"/><circle cx="20.4" cy="10.8" r="1"/>
          <circle cx="7.1" cy="14.3" r="1"/><circle cx="12.4" cy="14.3" r="1"/><circle cx="17.7" cy="14.3" r="1"/>
          <circle cx="4.5" cy="17.8" r="1"/><circle cx="9.8" cy="17.8" r="1"/><circle cx="15.1" cy="17.8" r="1"/><circle cx="20.4" cy="17.8" r="1"/>
        </g>
      </svg>`,
      GB: `<svg class="flag-svg" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
        <rect width="60" height="40" fill="#012169"/>
        <path d="M0,0 L60,40 M60,0 L0,40" stroke="#FFFFFF" stroke-width="7"/>
        <path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="3.6"/>
        <path d="M30,0 V40 M0,20 H60" stroke="#FFFFFF" stroke-width="11"/>
        <path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="6.5"/>
      </svg>`,
      DE: `<svg class="flag-svg" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
        <rect y="0" width="60" height="13.34" fill="#000000"/>
        <rect y="13.33" width="60" height="13.34" fill="#DD0000"/>
        <rect y="26.66" width="60" height="13.34" fill="#FFCE00"/>
      </svg>`,
      ES: `<svg class="flag-svg" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
        <rect y="0" width="60" height="10" fill="#AA151B"/>
        <rect y="10" width="60" height="20" fill="#F1BF00"/>
        <rect y="30" width="60" height="10" fill="#AA151B"/>
        <rect x="15" y="15" width="6" height="9" rx="2" fill="#AA151B"/>
        <rect x="16.5" y="16.5" width="3" height="6" fill="#F1BF00"/>
        <rect x="13" y="15" width="1.2" height="9" fill="#94A3B8"/>
        <rect x="21.8" y="15" width="1.2" height="9" fill="#94A3B8"/>
      </svg>`
    };

    const CITIES = [
      { name: "台北", timeZone: "Asia/Taipei", flag: "TW", isHome: true },
      { name: "東京", timeZone: "Asia/Tokyo", flag: "JP" },
      { name: "雪梨", timeZone: "Australia/Sydney", flag: "AU" },
      { name: "洛杉磯", timeZone: "America/Los_Angeles", flag: "US" },
      { name: "芝加哥", timeZone: "America/Chicago", flag: "US" },
      { name: "紐約", timeZone: "America/New_York", flag: "US" },
      { name: "倫敦", timeZone: "Europe/London", flag: "GB" },
      { name: "法蘭克福", timeZone: "Europe/Berlin", flag: "DE" },
      { name: "Moralzarzal", timeZone: "Europe/Madrid", flag: "ES" }
    ];

    const WEEKDAYS = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
    let is24Hour = true;

    const gridEl = document.getElementById("clockGrid");

    CITIES.forEach((city, idx) => {
      const card = document.createElement("article");
      card.className = `card${city.isHome ? " is-home" : ""}`;
      card.innerHTML = `
        <div class="card-header">
          <div class="city-info">
            ${FLAGS[city.flag]}
            <span class="city-name" title="${city.name}">${city.name}</span>
          </div>
          <div class="meta-right">
            <span class="dn-icon" id="daynight-${idx}"></span>
            <span class="utc-text" id="utc-${idx}">UTC</span>
          </div>
        </div>
        <div class="time-row">
          <span class="time-main" id="hm-${idx}">--:--</span>
          <span class="time-sec" id="sec-${idx}">--</span>
          <span class="time-ampm" id="ampm-${idx}"></span>
        </div>
        <div class="card-footer">
          <span class="date-text" id="date-${idx}">----/--/--</span>
          <span class="diff-tag" id="diff-${idx}">--</span>
        </div>
      `;
      gridEl.appendChild(card);
    });

    function getZonedParts(date, timeZone) {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone,
        hourCycle: "h23",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).formatToParts(date);

      const map = {};
      for (const p of parts) {
        if (p.type !== "literal") map[p.type] = Number(p.value);
      }
      const wallUtcMs = Date.UTC(map.year, map.month - 1, map.day, map.hour, map.minute, map.second);
      const weekdayIdx = new Date(wallUtcMs).getUTCDay();
      const dateKey = `${map.year}-${String(map.month).padStart(2, "0")}-${String(map.day).padStart(2, "0")}`;

      return { ...map, wallUtcMs, weekdayIdx, dateKey };
    }

    function formatUtcOffset(minutes) {
      const sign = minutes >= 0 ? "+" : "-";
      const abs = Math.abs(minutes);
      const h = Math.floor(abs / 60);
      const m = abs % 60;
      return m === 0 ? `UTC${sign}${h}` : `UTC${sign}${h}:${String(m).padStart(2, "0")}`;
    }

    function formatDiffFromTaipei(diffMinutes, targetDateKey, taipeiDateKey, isHome) {
      if (isHome) return "基準時間";
      const dayLabel =
        targetDateKey < taipeiDateKey ? "昨天 · " :
        targetDateKey > taipeiDateKey ? "明天 · " : "";

      if (diffMinutes === 0) return `${dayLabel}無時差`;
      const absHours = Math.abs(diffMinutes) / 60;
      const hourText = Number.isInteger(absHours) ? `${absHours}` : absHours.toFixed(1);
      const dir = diffMinutes > 0 ? "快" : "慢";
      return `${dayLabel}${dir} ${hourText} 小時`;
    }

    function updateClocks() {
      const now = new Date();
      const utcWallMs = Date.UTC(
        now.getUTCFullYear(),
        now.getUTCMonth(),
        now.getUTCDate(),
        now.getUTCHours(),
        now.getUTCMinutes(),
        now.getUTCSeconds()
      );
      const taipei = getZonedParts(now, "Asia/Taipei");

      CITIES.forEach((city, idx) => {
        const z = getZonedParts(now, city.timeZone);
        const utcOffsetMin = Math.round((z.wallUtcMs - utcWallMs) / 60000);
        const diffTaipeiMin = Math.round((z.wallUtcMs - taipei.wallUtcMs) / 60000);

        let displayHour = z.hour;
        let ampm = "";
        if (!is24Hour) {
          ampm = z.hour >= 12 ? "PM" : "AM";
          displayHour = z.hour % 12 || 12;
        }

        const hh = String(displayHour).padStart(2, "0");
        const mm = String(z.minute).padStart(2, "0");
        const ss = String(z.second).padStart(2, "0");

        document.getElementById(`hm-${idx}`).textContent = `${hh}:${mm}`;
        document.getElementById(`sec-${idx}`).textContent = ss;
        document.getElementById(`ampm-${idx}`).textContent = ampm;

        const isDay = z.hour >= 6 && z.hour < 18;
        const dnEl = document.getElementById(`daynight-${idx}`);
        dnEl.innerHTML = isDay ? SUN_ICON : MOON_ICON;
        dnEl.className = `dn-icon ${isDay ? "day" : "night"}`;
        dnEl.title = isDay ? "當地白天 (06:00–17:59)" : "當地夜晚 (18:00–05:59)";

        document.getElementById(`utc-${idx}`).textContent = formatUtcOffset(utcOffsetMin);
        document.getElementById(`date-${idx}`).textContent =
          `${z.year}/${String(z.month).padStart(2, "0")}/${String(z.day).padStart(2, "0")} ${WEEKDAYS[z.weekdayIdx]}`;
        document.getElementById(`diff-${idx}`).textContent =
          formatDiffFromTaipei(diffTaipeiMin, z.dateKey, taipei.dateKey, city.isHome);
      });
    }

    const formatBtn = document.getElementById("toggleFormat");
    formatBtn.addEventListener("click", () => {
      is24Hour = !is24Hour;
      formatBtn.textContent = is24Hour ? "24 小時制" : "12 小時制";
      updateClocks();
    });

    const themeBtn = document.getElementById("toggleTheme");
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("light");
      const isLight = document.body.classList.contains("light");
      themeBtn.textContent = isLight ? "深色模式" : "淺色模式";
    });

    const copyBtn = document.getElementById("copyAll");
    copyBtn.addEventListener("click", async () => {
      const lines = CITIES.map((city, idx) => {
        const hm = document.getElementById(`hm-${idx}`).textContent;
        const sec = document.getElementById(`sec-${idx}`).textContent;
        const ampm = document.getElementById(`ampm-${idx}`).textContent;
        const date = document.getElementById(`date-${idx}`).textContent;
        return `${city.name}：${date} ${hm}:${sec}${ampm ? " " + ampm : ""}`;
      });
      try {
        await navigator.clipboard.writeText(lines.join("\n"));
        copyBtn.textContent = "已複製 ✓";
        setTimeout(() => (copyBtn.textContent = "複製時間"), 1500);
      } catch {
        copyBtn.textContent = "複製失敗";
        setTimeout(() => (copyBtn.textContent = "複製時間"), 1500);
      }
    });

    updateClocks();
    const delayToNextSecond = 1000 - (Date.now() % 1000);
    setTimeout(() => {
      updateClocks();
      setInterval(updateClocks, 1000);
    }, delayToNextSecond);
  </script>
</body>
</html>
